name: Build All Platforms

# CI pipeline.
# - Pull requests -> analyze + test gate (fast feedback)
# - Push to main / tag v* -> full artifact builds for
#   Windows, macOS, Linux, Android and iOS
#
# Verified locally on 2026-10-21:
#  - flutter analyze: 0 issues
#  - flutter test: 50/50 (unit + widget + golden matrix)
#  - flutter build web --release: OK
#  - flutter build linux --release: OK
# This workflow extends the same proven pipeline to platforms that need
# their native OS toolchains.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze + Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: files-recovery-free-linux-x64
          path: build/linux/x64/release/bundle/

  windows:
    name: Windows desktop
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: files-recovery-free-windows-x64
          path: build/windows/x64/runner/Release/

  macos:
    name: macOS desktop
    runs-on: macos-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: files-recovery-free-macos
          path: build/macos/Build/Products/Release/*.app

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: files-recovery-free-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned build)
    runs-on: macos-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: files-recovery-free-ios-unsigned
          path: build/ios/iphoneos/Runner.app
